<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        for(let i=1;i<=10;i++){
            console.log(i);
        }

        let sum=0;
        let num=2;
        while(num<=100){
            sum += num;
            num +=2; // move to the next even number
        }
        console.log("Sum of even numbers from 1 to 100:", sum);
    </script>
</head>
