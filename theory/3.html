Discuss the use of <script> tag in HTML. How can you link an external JavaScript file to an HTML
document?

Ans: The <script> tag is used in HTML to embed or reference JavaScript code. JavaScript adds interactivity and dynamic behavior to web pages, such as form validation, animations, handling user events, and manipulating HTML elements.
    Common uses of the <script> tag

    Writing JavaScript directly inside an HTML file

    Linking an external JavaScript file

    Executing code when a page loads or when an event occurs

    Manipulating the DOM (Document Object Model)

    Basic syntax (inline JavaScript)
    <script>
    alert("Hello, World!");
    </script>

Linking an external JavaScript file

    To keep code clean and reusable, JavaScript is often written in a separate .js file and linked to the HTML document using the src attribute of the <script> tag.

Example: Linking an external file
    <script src="script.js"></script>
